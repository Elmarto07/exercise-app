<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marca Fit — Home (registrado + categoría)</title>
  <!-- Spine: DESIGN.md § Components (chips, post-workout); EXPERIENCE.md § UJ-1 steps 3-7 -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #e5e5e5; display: flex; justify-content: center; padding: 24px; }
    .phone { width: 390px; min-height: 844px; background: #FAFAFA; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px #00000030; display: flex; flex-direction: column; }
    .status { height: 44px; }
    .content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
    .display { font-size: 28px; font-weight: 700; color: #171717; letter-spacing: -0.02em; }
    .date { font-size: 13px; color: #737373; margin-top: 8px; }
    .cta-registered { background: #fff; color: #16A34A; border: 2px solid #22C55E; border-radius: 16px; min-height: 56px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .check { width: 22px; height: 22px; background: #22C55E; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .chips-label { font-size: 13px; color: #737373; margin-top: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { background: #fff; border: 1px solid #E5E5E5; border-radius: 9999px; padding: 10px 16px; font-size: 14px; min-height: 44px; cursor: pointer; }
    .chip.selected { background: #DCFCE7; border-color: #22C55E; color: #16A34A; font-weight: 500; }
    .chip.omit { color: #737373; border-style: dashed; }
    .card { background: #fff; border: 1px solid #E5E5E5; border-radius: 12px; padding: 16px; }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-meta { font-size: 13px; color: #737373; margin-top: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-fill { flex: 1; background: #22C55E; color: #fff; border: none; border-radius: 12px; min-height: 48px; font-weight: 600; cursor: pointer; }
    .btn-ghost { background: none; border: none; color: #737373; font-size: 14px; cursor: pointer; padding: 12px; }
    .mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
    .day { aspect-ratio: 1; border-radius: 8px; font-size: 11px; display: flex; align-items: center; justify-content: center; background: #F5F5F5; color: #737373; border: 1px solid #E5E5E5; }
    .day.registered { background: #DCFCE7; border: 2px solid #22C55E; color: #16A34A; font-weight: 600; }
    .day.today { box-shadow: 0 0 0 2px #22C55E; }
    .link { font-size: 16px; color: #737373; text-align: center; margin-top: auto; padding-bottom: 24px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"></div>
    <div class="content">
      <div>
        <h1 class="display">¿Entrenaste hoy?</h1>
        <p class="date">Sábado, 11 de julio</p>
      </div>
      <button class="cta-registered"><span class="check">✓</span> Ya registrado — toca para desmarcar</button>
      <div>
        <p class="chips-label">¿Qué entrenaste?</p>
        <div class="chips">
          <span class="chip selected">Piernas</span>
          <span class="chip">Torso</span>
          <span class="chip">Cardio</span>
          <span class="chip">Cuerpo completo</span>
          <span class="chip omit">Omitir</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Estiramiento post-piernas</div>
        <div class="card-meta">~4 min · isquios, cuádriceps, glúteos</div>
        <div class="card-actions">
          <button class="btn-fill">Estirar ahora</button>
          <button class="btn-ghost">Ahora no</button>
        </div>
      </div>
      <div>
        <p class="chips-label">Últimos 7 días</p>
        <div class="mini-cal">
          <div class="day">5</div><div class="day registered">6</div><div class="day">7</div><div class="day registered">8</div><div class="day">9</div><div class="day registered">10</div><div class="day registered today">11</div>
        </div>
      </div>
      <a class="link">Historial · últimos 30 días</a>
    </div>
  </div>
</body>
</html>
