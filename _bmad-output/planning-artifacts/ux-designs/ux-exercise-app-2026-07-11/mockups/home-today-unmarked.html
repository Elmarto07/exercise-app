<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marca Fit — Home (sin registrar)</title>
  <!-- Spine: DESIGN.md § Components (button-primary, daily stretch card); EXPERIENCE.md § UJ-1 step 2, UJ-3 step 2 -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #e5e5e5; display: flex; justify-content: center; padding: 24px; }
    .phone { width: 390px; min-height: 844px; background: #FAFAFA; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px #00000030; display: flex; flex-direction: column; }
    .status { height: 44px; }
    .content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
    .header { padding-top: 8px; }
    .display { font-size: 28px; font-weight: 700; color: #171717; letter-spacing: -0.02em; line-height: 1.2; }
    .date { font-size: 13px; font-weight: 500; color: #737373; margin-top: 8px; }
    .cta-primary { background: #22C55E; color: #fff; border: none; border-radius: 16px; min-height: 56px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 32px; }
    .card { background: #fff; border: 1px solid #E5E5E5; border-radius: 12px; padding: 16px; }
    .card-title { font-size: 16px; font-weight: 600; color: #171717; }
    .card-meta { font-size: 13px; color: #737373; margin-top: 4px; }
    .cta-secondary { background: #fff; color: #171717; border: 1px solid #E5E5E5; border-radius: 12px; min-height: 48px; width: 100%; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 12px; }
    .link { font-size: 16px; color: #737373; text-align: center; margin-top: auto; padding-bottom: 24px; text-decoration: underline; cursor: pointer; }
    .banner { background: #DCFCE7; border: 1px solid #22C55E; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #16A34A; display: flex; justify-content: space-between; align-items: center; }
    .banner button { background: none; border: none; color: #737373; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"></div>
    <div class="content">
      <div class="banner">
        <span>Añade Marca Fit a tu inicio</span>
        <button aria-label="Cerrar">×</button>
      </div>
      <div class="header">
        <h1 class="display">¿Entrenaste hoy?</h1>
        <p class="date">Sábado, 11 de julio</p>
      </div>
      <button class="cta-primary">Marcar entreno de hoy</button>
      <div class="card">
        <div class="card-title">Rutina diaria</div>
        <div class="card-meta">~5 min · cuello, hombros, cadera</div>
        <button class="cta-secondary">Estirar ahora</button>
      </div>
      <a class="link">Historial · últimos 30 días</a>
    </div>
  </div>
</body>
</html>
